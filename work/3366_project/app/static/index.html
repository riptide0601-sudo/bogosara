<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>LabelLens 검색</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f5f6f8;
    color: #1c1c1e;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
  }
  .search-box {
    display: flex;
    gap: 8px;
    max-width: 640px;
    margin-bottom: 12px;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d0d3d9;
    border-radius: 8px;
    font-size: 15px;
  }
  input[type=text]:focus { outline: 2px solid #4f7cff; }
  .category-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 640px;
    margin-bottom: 24px;
  }
  .category-chip {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #d0d3d9;
    background: #fff;
    color: #4b5563;
    cursor: pointer;
  }
  .category-chip:hover { background: #f0f2f5; }
  .category-chip.active {
    background: #4f7cff;
    border-color: #4f7cff;
    color: #fff;
  }
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1000px;
  }
  .panel {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
    min-height: 200px;
  }
  .panel h2 {
    font-size: 14px;
    color: #6b7280;
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .item {
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .item:hover { background: #f0f2f5; }
  .item .name { font-weight: 600; font-size: 14px; }
  .item .sub { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .empty { color: #9ca3af; font-size: 13px; padding: 8px; }
  .detail {
    max-width: 1000px;
    margin-top: 20px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
    display: none;
  }
  .detail h2 { margin: 0 0 4px; font-size: 17px; }
  .detail .brand { color: #6b7280; font-size: 13px; margin-bottom: 12px; }
  .ing-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f2f5;
    font-size: 13px;
  }
  .purpose-tag {
    display: inline-block;
    background: #eef1ff;
    color: #4f5bd5;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    margin: 2px 4px 0 0;
  }
  .llm-summary {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #f0f2f5;
    font-size: 13px;
    line-height: 1.6;
    color: #374151;
  }
  .llm-summary.loading {
    color: #9ca3af;
    font-style: italic;
  }
  .upload-box {
    max-width: 640px;
    margin-bottom: 12px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 16px;
  }
  .upload-box h2 {
    font-size: 14px;
    color: #6b7280;
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .ocr-status {
    font-size: 13px;
    color: #374151;
    margin-top: 10px;
  }
  .ocr-status.loading { color: #4f7cff; }
  .ocr-status.error { color: #dc2626; }
  .ocr-results-panel {
    max-width: 640px;
    margin-bottom: 24px;
  }
  .ocr-results-panel .item.ocr-unmatched {
    opacity: .6;
  }
  .ocr-results-panel .item.ocr-unmatched .name {
    font-weight: 400;
  }
  .relations-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #f0f2f5;
  }
  .relations-section h3 {
    font-size: 13px;
    color: #6b7280;
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .relation-item {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .relation-item:hover { filter: brightness(0.97); }
  .relation-item.relation-good {
    background: #eefdf3;
    border-color: #bbf0cf;
  }
  .relation-item.relation-caution {
    background: #fef2f2;
    border-color: #fecaca;
  }
  .relation-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .relation-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .relation-good .relation-badge { background: #16a34a; color: #fff; }
  .relation-caution .relation-badge { background: #dc2626; color: #fff; }
  .relation-name { font-weight: 600; font-size: 13px; }
  .relation-message { font-size: 12px; color: #4b5563; line-height: 1.5; }
  .similar-products-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #f0f2f5;
    margin-bottom: 14px;
  }
  .similar-products-section h3 {
    font-size: 13px;
    color: #6b7280;
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .similar-product-item {
    background: #f7f9ff;
    border: 1px solid #e3e8fd;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .buy-link {
    font-size: 13px;
    color: #6b7280;
    margin-top: 4px;
  }
  .oliveyoung-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #2f7d32;
    text-decoration: none;
  }
  .buy-link .oliveyoung-link { margin-top: 0; }
  .oliveyoung-link:hover { text-decoration: underline; }
  .category-box {
    margin-top: 12px;
    padding: 12px;
    background: #fffaf0;
    border: 1px solid #fde8c7;
    border-radius: 8px;
  }
  .category-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #b45309;
    background: #fef3c7;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .category-box p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #4b5563;
    line-height: 1.6;
  }
  .key-info-box {
    margin-top: 12px;
    padding: 12px;
    background: #f7f9ff;
    border: 1px solid #e3e8fd;
    border-radius: 8px;
  }
  .key-info-box h3 {
    font-size: 12px;
    color: #6b7280;
    margin: 0 0 8px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .key-ingredients-list {
    font-size: 13px;
    color: #374151;
    margin-bottom: 6px;
  }
  .skin-score-summary {
    margin-top: 10px;
    font-size: 12px;
    color: #4b5563;
    background: #f0f2f5;
    border-radius: 6px;
    padding: 8px 10px;
    line-height: 1.5;
  }
  .item .skin-score-summary {
    margin-top: 4px;
    padding: 0;
    background: none;
    font-size: 11px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <h1>LabelLens 검색</h1>

  <div class="upload-box">
    <h2>전성분 사진으로 분석</h2>
    <input type="file" id="ocr-input" accept="image/*">
    <div id="ocr-status" class="ocr-status"></div>
  </div>
  <div class="panel ocr-results-panel" id="ocr-results-panel" style="display:none;">
    <h2>인식된 성분</h2>
    <div id="ocr-results" class="empty"></div>
  </div>

  <div class="search-box">
    <input type="text" id="q" placeholder="제품명 또는 성분명 검색 (예: 히알루론산, 아누아)" autofocus>
  </div>
  <div class="category-filter" id="category-filter">
    <button class="category-chip active" data-category="">전체</button>
    <button class="category-chip" data-category="스킨/토너">스킨/토너</button>
    <button class="category-chip" data-category="세럼/에센스/앰플">세럼/에센스/앰플</button>
    <button class="category-chip" data-category="크림">크림</button>
    <button class="category-chip" data-category="기타">기타</button>
  </div>

  <div class="columns">
    <div class="panel">
      <h2>제품</h2>
      <div id="products" class="empty">검색어를 입력하세요</div>
    </div>
    <div class="panel">
      <h2>성분</h2>
      <div id="ingredients" class="empty">검색어를 입력하세요</div>
    </div>
  </div>

  <div class="detail" id="detail"></div>

<script>
const qInput = document.getElementById('q');
const productsEl = document.getElementById('products');
const ingredientsEl = document.getElementById('ingredients');
const detailEl = document.getElementById('detail');
const categoryFilterEl = document.getElementById('category-filter');
let selectedCategory = '';

categoryFilterEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.category-chip');
  if (!btn) return;
  categoryFilterEl.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedCategory = btn.dataset.category;
  runSearch(qInput.value.trim());
});
const ocrInput = document.getElementById('ocr-input');
const ocrStatusEl = document.getElementById('ocr-status');
const ocrResultsPanelEl = document.getElementById('ocr-results-panel');
const ocrResultsEl = document.getElementById('ocr-results');

ocrInput.addEventListener('change', () => {
  const file = ocrInput.files[0];
  if (file) runOcrAnalyze(file);
});

function runOcrAnalyze(file) {
  detailEl.style.display = 'none';
  ocrResultsPanelEl.style.display = 'block';
  ocrResultsEl.className = 'empty';
  ocrResultsEl.textContent = '';
  ocrStatusEl.className = 'ocr-status loading';
  ocrStatusEl.textContent = '사진을 분석하는 중입니다... (엔진에 따라 수십 초 걸릴 수 있어요)';

  const formData = new FormData();
  formData.append('file', file);

  fetch('ocr/analyze', { method: 'POST', body: formData })
    .then(r => {
      if (!r.ok) return r.json().then(e => { throw new Error(e.detail || ('분석 실패: ' + r.status)); });
      return r.json();
    })
    .then(renderOcrResults)
    .catch(err => {
      ocrStatusEl.className = 'ocr-status error';
      ocrStatusEl.textContent = err.message || '분석 중 오류가 발생했습니다';
    });
}

function renderOcrResults(data) {
  const matchedCount = data.results.filter(r => r.ingredient).length;
  ocrStatusEl.className = 'ocr-status';
  ocrStatusEl.textContent = `성분 ${data.results.length}개 인식 · ${matchedCount}개 DB 매칭 (엔진: ${data.engine})`;

  if (data.results.length === 0) {
    ocrResultsEl.className = 'empty';
    ocrResultsEl.textContent = '인식된 성분이 없습니다';
    return;
  }

  ocrResultsEl.className = '';
  ocrResultsEl.innerHTML = '';
  data.results.forEach(r => {
    const div = document.createElement('div');
    const ing = r.ingredient;
    if (ing) {
      div.className = 'item';
      const purposeTags = (ing.purposes || [])
        .map(p => `<span class="purpose-tag">${escapeHtml(p.purpose_name)}</span>`)
        .join('');
      div.innerHTML = `
        <div class="name">${escapeHtml(ing.name_kr || ing.name_en || '')}</div>
        <div class="sub">OCR 인식: ${escapeHtml(r.matched_text)}</div>
        <div>${purposeTags}</div>
      `;
      div.addEventListener('click', () => showIngredientDetail(ing.ingredient_id));
    } else {
      div.className = 'item ocr-unmatched';
      div.innerHTML = `
        <div class="name">${escapeHtml(r.matched_text)}</div>
        <div class="sub">DB에 등록되지 않은 성분입니다</div>
      `;
    }
    ocrResultsEl.appendChild(div);
  });
}

let debounceTimer = null;

qInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => runSearch(qInput.value.trim()), 200);
});

function runSearch(query) {
  detailEl.style.display = 'none';

  if (!query && !selectedCategory) {
    productsEl.className = 'empty';
    productsEl.textContent = '검색어를 입력하세요';
    ingredientsEl.className = 'empty';
    ingredientsEl.textContent = '검색어를 입력하세요';
    return;
  }

  const productParams = new URLSearchParams();
  if (query) productParams.set('query', query);
  if (selectedCategory) productParams.set('category', selectedCategory);

  fetch('products?' + productParams.toString())
    .then(r => r.json())
    .then(renderProducts)
    .catch(() => { productsEl.className = 'empty'; productsEl.textContent = '검색 중 오류가 발생했습니다'; });

  if (!query) {
    ingredientsEl.className = 'empty';
    ingredientsEl.textContent = '성분은 카테고리 필터 대상이 아니에요';
    return;
  }

  fetch('ingredients?query=' + encodeURIComponent(query))
    .then(r => r.json())
    .then(renderIngredients)
    .catch(() => { ingredientsEl.className = 'empty'; ingredientsEl.textContent = '검색 중 오류가 발생했습니다'; });
}

function renderProducts(list) {
  if (list.length === 0) {
    productsEl.className = 'empty';
    productsEl.textContent = '결과 없음';
    return;
  }
  productsEl.className = '';
  productsEl.innerHTML = '';
  list.slice(0, 30).forEach(p => {
    const div = document.createElement('div');
    div.className = 'item';
    const cardSkinScoreHtml = p.skin_score_summary && p.skin_score_summary !== '...'
      ? `<div class="skin-score-summary">${escapeHtml(p.skin_score_summary)}</div>`
      : '';
    div.innerHTML = `
      <div class="name">${escapeHtml(p.product_name)}</div>
      <div class="sub">${escapeHtml(p.brand || '')}</div>
      ${cardSkinScoreHtml}
      <a class="oliveyoung-link" href="${escapeHtml(p.oliveyoung_url)}" target="_blank" rel="noopener noreferrer">올리브영에서 보기 ↗</a>
    `;
    div.addEventListener('click', () => showProductDetail(p.product_id));
    div.querySelector('.oliveyoung-link').addEventListener('click', e => e.stopPropagation());
    productsEl.appendChild(div);
  });
}

function renderIngredients(list) {
  if (list.length === 0) {
    ingredientsEl.className = 'empty';
    ingredientsEl.textContent = '결과 없음';
    return;
  }
  ingredientsEl.className = '';
  ingredientsEl.innerHTML = '';
  list.slice(0, 30).forEach(i => {
    const div = document.createElement('div');
    div.className = 'item';
    const purposeTags = (i.purposes || [])
      .map(p => `<span class="purpose-tag">${escapeHtml(p.purpose_name)}</span>`)
      .join('');
    div.innerHTML = `
      <div class="name">${escapeHtml(i.name_kr || '')}</div>
      <div class="sub">${escapeHtml(i.name_en || '')}</div>
      <div>${purposeTags}</div>
    `;
    div.addEventListener('click', () => showIngredientDetail(i.ingredient_id));
    ingredientsEl.appendChild(div);
  });
}

const productSummaryRequestsInFlight = new Set();

function showProductDetail(productId) {
  fetch('products/' + encodeURIComponent(productId))
    .then(r => r.json())
    .then(p => {
      detailEl.style.display = 'block';
      renderProductDetail(p);
      if (!p.summary) {
        requestProductSummary(productId);
      }
    });
}

function renderProductDetail(p) {
  const rows = p.ingredients.map(pi => {
    const purposeTags = (pi.ingredient.purposes || [])
      .map(pur => `<span class="purpose-tag">${escapeHtml(pur.purpose_name)}</span>`)
      .join('');
    return `
      <div class="ing-row">
        <span>${escapeHtml(pi.ingredient.name_kr || pi.ingredient.name_en || '')}</span>
        <span>${escapeHtml(pi.matched_text || '')}</span>
      </div>
      <div>${purposeTags}</div>
    `;
  }).join('');
  const summaryHtml = p.summary
    ? `<p class="llm-summary">${escapeHtml(p.summary)}</p>`
    : `<p class="llm-summary loading">전성분 기반 요약 생성 중...</p>`;
  const categoryHtml = p.category_description
    ? `<div class="category-box"><span class="category-tag">${escapeHtml(p.category)}</span><p>${escapeHtml(p.category_description)}</p></div>`
    : '';
  const hasKeyIngredients = p.key_ingredients && p.key_ingredients.length > 0;
  const hasKeyPurposes = p.key_purposes && p.key_purposes.length > 0;
  const keyPurposeTags = hasKeyPurposes
    ? p.key_purposes.map(pp => `<span class="purpose-tag">${escapeHtml(pp)}</span>`).join('')
    : '';
  const keyInfoHtml = (hasKeyIngredients || hasKeyPurposes)
    ? `
      <div class="key-info-box">
        <h3>핵심 성분/효능</h3>
        ${hasKeyIngredients ? `<div class="key-ingredients-list">${escapeHtml(p.key_ingredients.join(', '))}</div>` : ''}
        ${keyPurposeTags}
      </div>
    `
    : '';
  const skinScoreHtml = p.skin_score_summary && p.skin_score_summary !== '...'
    ? `<div class="skin-score-summary">${escapeHtml(p.skin_score_summary)}</div>`
    : '';
  detailEl.dataset.productId = p.product_id;
  detailEl.innerHTML = `
    <h2>${escapeHtml(p.product_name)}</h2>
    <div class="brand">${escapeHtml(p.brand || '')}</div>
    <div class="buy-link">구매처: <a class="oliveyoung-link" href="${escapeHtml(p.oliveyoung_url)}" target="_blank" rel="noopener noreferrer">올리브영에서 보기 ↗</a></div>
    ${categoryHtml}
    ${keyInfoHtml}
    ${skinScoreHtml}
    ${summaryHtml}
    ${renderSimilarProducts(p.similar_products)}
    ${rows || '<div class="empty">등록된 성분 없음</div>'}
  `;
  detailEl.querySelectorAll('.similar-product-item').forEach(el => {
    el.addEventListener('click', () => showProductDetail(el.dataset.productId));
    el.querySelector('.oliveyoung-link').addEventListener('click', e => e.stopPropagation());
  });
}

function renderSimilarProducts(similarProducts) {
  if (!similarProducts || similarProducts.length === 0) return '';
  const rows = similarProducts.map(sp => `
    <div class="item similar-product-item" data-product-id="${escapeHtml(sp.product.product_id)}">
      <div class="name">${escapeHtml(sp.product.product_name)}</div>
      <div class="sub">${escapeHtml(sp.product.brand || '')} · 유사도 ${Math.round(sp.score * 100)}%</div>
      <a class="oliveyoung-link" href="${escapeHtml(sp.product.oliveyoung_url)}" target="_blank" rel="noopener noreferrer">올리브영에서 보기 ↗</a>
    </div>
  `).join('');
  return `
    <div class="similar-products-section">
      <h3>비슷한 제품</h3>
      ${rows}
    </div>
  `;
}

function requestProductSummary(productId) {
  if (productSummaryRequestsInFlight.has(productId)) return;
  productSummaryRequestsInFlight.add(productId);

  fetch('products/' + encodeURIComponent(productId) + '/generate-summary', { method: 'POST' })
    .then(r => {
      if (!r.ok) throw new Error('generate-summary failed: ' + r.status);
      return r.json();
    })
    .then(data => {
      productSummaryRequestsInFlight.delete(productId);
      if (String(detailEl.dataset.productId) !== String(productId)) return;
      const loadingEl = detailEl.querySelector('.llm-summary.loading');
      if (loadingEl) {
        loadingEl.textContent = data.summary || '요약을 생성하지 못했습니다.';
        loadingEl.classList.remove('loading');
      }
    })
    .catch(() => {
      productSummaryRequestsInFlight.delete(productId);
      if (String(detailEl.dataset.productId) !== String(productId)) return;
      const loadingEl = detailEl.querySelector('.llm-summary.loading');
      if (loadingEl) {
        loadingEl.textContent = '요약 생성 중 오류가 발생했습니다.';
        loadingEl.classList.remove('loading');
      }
    });
}

const summaryRequestsInFlight = new Set();

function showIngredientDetail(ingredientId) {
  Promise.all([
    fetch('ingredients/' + ingredientId).then(r => r.json()),
    fetch('ingredients/' + ingredientId + '/relations').then(r => r.json()).catch(() => []),
  ]).then(([i, relations]) => {
    detailEl.style.display = 'block';
    renderIngredientDetail(i, relations);
    if (!i.llm_summary || !i.llm_summary.summary_text) {
      requestLlmSummary(ingredientId);
    }
  });
}

function renderIngredientDetail(i, relations) {
  const purposes = (i.purposes || []).map(p => `<span class="purpose-tag">${escapeHtml(p.purpose_name)}</span>`).join('');
  const summaryHtml = i.llm_summary && i.llm_summary.summary_text
    ? `<p class="llm-summary">${escapeHtml(i.llm_summary.summary_text)}</p>`
    : `<p class="llm-summary loading">쉬운 설명 생성 중...</p>`;
  const benefit = i.llm_summary && i.llm_summary.benefit_text
    ? `<p><strong>좋은 점</strong><br>${escapeHtml(i.llm_summary.benefit_text)}</p>` : '';
  const caution = i.llm_summary && i.llm_summary.caution_text
    ? `<p><strong>주의할 점</strong><br>${escapeHtml(i.llm_summary.caution_text)}</p>` : '';
  detailEl.dataset.ingredientId = i.ingredient_id;
  detailEl.innerHTML = `
    <h2>${escapeHtml(i.name_kr || '')}</h2>
    <div class="brand">${escapeHtml(i.name_en || '')}</div>
    <div>${purposes || '<span class="empty">배합목적 정보 없음</span>'}</div>
    ${summaryHtml}
    ${benefit}
    ${caution}
    ${renderRelations(relations)}
  `;
  detailEl.querySelectorAll('.relation-item').forEach(el => {
    el.addEventListener('click', () => showIngredientDetail(Number(el.dataset.ingredientId)));
  });
}

function renderRelations(relations) {
  if (!relations || relations.length === 0) return '';
  const rows = relations.map(r => {
    const isGood = r.relation_type === '시너지';
    const cls = isGood ? 'relation-good' : 'relation-caution';
    const label = isGood ? '함께 쓰면 좋아요' : '같이 쓸 때 주의하세요';
    const name = r.related_ingredient.name_kr || r.related_ingredient.name_en || '';
    return `
      <div class="relation-item ${cls}" data-ingredient-id="${r.related_ingredient.ingredient_id}">
        <div class="relation-header">
          <span class="relation-badge">${escapeHtml(label)}</span>
          <span class="relation-name">${escapeHtml(name)}</span>
        </div>
        <div class="relation-message">${escapeHtml(r.user_message || '')}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="relations-section">
      <h3>성분 궁합</h3>
      ${rows}
    </div>
  `;
}

function requestLlmSummary(ingredientId) {
  if (summaryRequestsInFlight.has(ingredientId)) return;
  summaryRequestsInFlight.add(ingredientId);

  fetch('ingredients/' + ingredientId + '/generate-summary', { method: 'POST' })
    .then(r => {
      if (!r.ok) throw new Error('generate-summary failed: ' + r.status);
      return r.json();
    })
    .then(data => {
      summaryRequestsInFlight.delete(ingredientId);
      if (String(detailEl.dataset.ingredientId) !== String(ingredientId)) return;
      const loadingEl = detailEl.querySelector('.llm-summary.loading');
      if (loadingEl) {
        loadingEl.textContent = data.summary_text || '설명을 생성하지 못했습니다.';
        loadingEl.classList.remove('loading');
      }
    })
    .catch(() => {
      summaryRequestsInFlight.delete(ingredientId);
      if (String(detailEl.dataset.ingredientId) !== String(ingredientId)) return;
      const loadingEl = detailEl.querySelector('.llm-summary.loading');
      if (loadingEl) {
        loadingEl.textContent = '설명 생성 중 오류가 발생했습니다.';
        loadingEl.classList.remove('loading');
      }
    });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
